# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: release
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  create_nuget:
    runs-on: ubuntu-latest

    strategy:
        matrix:
            project:
                - RootBlocks
                - RootBlocks.AspNetCore.OpenApi
                - RootBlocks.Logging.Serilog
                - RootBlocks.Messaging.MediatR
                - RootBlocks.Persistence
                - RootBlocks.Persistence.EntityFramework
                - RootBlocks.Persistence.MySqlClient
                - RootBlocks.Persistence.Npgsql
                - RootBlocks.Persistence.Oracle
                - RootBlocks.Persistence.SqlClient
                - RootBlocks.Persistence.SQLite
                - RootBlocks.Serialization
                - RootBlocks.Serialization.Newtonsoft.Json

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

    # Install the .NET SDK indicated in the global.json file
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    # Create the NuGet package in the folder from the environment variable NuGetDirectory
    - run: dotnet pack src/${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release --output ${{ env.NuGetDirectory }}

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - uses: actions/upload-artifact@v4
      with:
        # v4 rejects several parallel jobs writing one artifact name, so each matrix leg gets its own
        name: nuget-${{ matrix.project }}
        if-no-files-found: error
        retention-days: 7
        path: |
          ${{ env.NuGetDirectory }}/*.nupkg
          ${{ env.NuGetDirectory }}/*.snupkg

  run_test:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            global-json-file: global.json
        - name: Run tests
          run: dotnet test --configuration Release
  deploy:
    # Publish only when creating a GitHub Release
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ create_nuget, run_test ]
    # The trusted publishing policy on nuget.org requires this environment by name.
    environment: nuget
    permissions:
      id-token: write # Lets NuGet/login exchange GitHub's OIDC token for a short-lived nuget.org API key
    steps:
      # Download the NuGet packages created in the previous job
      - uses: actions/download-artifact@v4
        with:
          pattern: nuget-*
          merge-multiple: true
          path: ${{ env.NuGetDirectory }}

      # No checkout in this job, so there is no global.json to read: any SDK can push packages.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      # MinVer only reads tags prefixed with v. A release tagged 0.8.0 packs as 0.7.1-alpha.0.N, and
      # publishing that by mistake cannot be undone, so stop unless every package carries the tag's version.
      - name: Check the packages match the release tag
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not ($tag -match '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$')) { throw "Release tag '$tag' must look like v1.2.3: MinVer ignores tags without the v prefix" }
          $version = $Matches[1]
          $files = @(Get-ChildItem "${{ env.NuGetDirectory }}" -Filter *.nupkg)
          $wrong = @($files | Where-Object { -not $_.Name.EndsWith(".$version.nupkg") })
          if ($files.Count -eq 0 -or $wrong.Count -gt 0) { throw "Packages do not match version ${version}: $($wrong.Name -join ', ')" }

      # Trusted publishing: no stored secret. The policy on nuget.org names this repo, release.yml
      # and the nuget environment; any mismatch and the token exchange is refused.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: sebdesalvador

      # Pushed one at a time, with the core RootBlocks package last. A publish cannot be undone, and
      # every other package depends on the core one: if a push is rejected, it happens before the
      # core package of that version is out on its own. nuget.org does not require a dependency to
      # exist yet. --skip-duplicate lets a retried workflow skip packages that already made it.
      # The symbol package next to each .nupkg is pushed automatically.
      - name: Publish NuGet packages
        run: |
          $files = @(Get-ChildItem "${{ env.NuGetDirectory }}" -Filter *.nupkg | Sort-Object { $_.Name -match '^RootBlocks\.\d' }, Name)
          if ($files.Count -eq 0) { throw "No package found" }
          foreach($file in $files) {
              dotnet nuget push $file.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "Pushing $($file.Name) failed" }
          }
